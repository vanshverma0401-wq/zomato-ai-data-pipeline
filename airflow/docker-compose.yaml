name: zomato_airflow

x-airflow-common: &airflow-common
  image: zomato-airflow:3.1.6-python3.12
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  user: "${AIRFLOW_UID}:0"
  env_file:
    - ../.env.local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow"
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_WEB_SECRET}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_SERVICE_LOGIN: ${SNOWFLAKE_SERVICE_LOGIN}
    SNOWFLAKE_KEY_PASSPHRASE: ${SNOWFLAKE_KEY_PASSPHRASE}
    SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_airflow_key.p8
    PYTHONPATH: /opt/airflow
    AI_STATE_DIR: /opt/airflow/ai_state
    SAMPLE_N: '5'
    RAG_SAMPLE_N: '100'
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: >-
      {"conn_type":"snowflake","login":"${SNOWFLAKE_SERVICE_LOGIN}","password":"${SNOWFLAKE_KEY_PASSPHRASE}","schema":"RAW","extra":{"account":"${SNOWFLAKE_ACCOUNT}","warehouse":"ZOMATO_WH","database":"ZOMATO","role":"DBT_ROLE","private_key_file":"/run/secrets/snowflake_airflow_key.p8"}}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./scripts:/opt/airflow/scripts:ro
    - ./profiles:/opt/airflow/dbt_profiles:ro
    - ../zomato:/opt/airflow/dbt/zomato
    - ${ZOMATO_AIRFLOW_SECRET_DIR}:/run/secrets:ro
    - airflow_logs:/opt/airflow/logs
    - ai_state:/opt/airflow/ai_state
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    command: bash /opt/airflow/scripts/initialize.sh

  apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)); assert data['metadatabase']['status']=='healthy'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  rag-app:
    <<: *airflow-common
    command: [bash, -c, "exec /opt/ai_venv/bin/streamlit run /opt/airflow/ai/rag_chat.py --server.address=0.0.0.0 --server.port=8501 --browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8501:8501"

  sql-app:
    <<: *airflow-common
    command: [bash, -c, "exec /opt/ai_venv/bin/streamlit run /opt/airflow/ai/text_to_sql.py --server.address=0.0.0.0 --server.port=8502 --browser.gatherUsageStats=false"]
    ports:
      - "127.0.0.1:8502:8502"

volumes:
  pgdata:
  airflow_logs:
  ai_state:
